<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>陣前招親</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <section class="viewer" aria-label="手繪塗鴉立體舞台背景">
        <div id="stage">
          <canvas id="scene-canvas" tabindex="0" aria-label="水墨山寨，0 自動鏡頭，1 到 5 切換視角，Q 土撥鼠與影片，P 暫停。"></canvas>
          <div id="loading" hidden></div>
          <div id="error" role="alert" hidden></div>
        </div>
      </section>
      <div hidden aria-hidden="true">
        <span id="phase">穆柯寨內</span>
        <span id="cue-note">穆桂英耍劍出台／探馬來報</span>
        <input id="progress" type="range" min="0" max="1000" value="0" step="1" />
        <button id="intro" type="button">播放塗鴉成景</button>
        <button id="motion" type="button" aria-pressed="false">暫停風景</button>
        <input id="orbit" type="range" min="-100" max="100" value="0" step="1" />
        <button id="reset-view" type="button">回到定鏡</button>
        <button id="clean" type="button">隱藏介面</button>
        <button id="fullscreen" type="button">全螢幕</button>
        <button id="cue-inside" type="button" aria-pressed="true">穆柯寨內</button>
        <button id="cue-outside" type="button" aria-pressed="false">寨外山道</button>
        <button id="cue-gate" type="button" aria-pressed="false">寨門近景</button>
        <button id="cue-left" type="button" aria-pressed="false">左側斜景</button>
        <button id="cue-river" type="button" aria-pressed="false">河岸高景</button>
      </div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
